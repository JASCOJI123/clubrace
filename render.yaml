# DRIVER HUB — Render.com Blueprint
#
# UptimeRobot bilan 24/7:
#   Har bir web servis uchun https://<service>.onrender.com/health ni
#   5 daqiqada bir marta ping qiling (Render bepul 15 daqiqa bo'sh tursa uxlaydi).

services:
  # ── API + Mini App + Admin ────────────────────────────────────────────
  - type: web
    name: driverhub-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: PORT
        value: "3000"
      - key: API_HOST
        value: "0.0.0.0"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@driverhub.uz
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: driverhub-db
          property: connectionString
    healthCheckPath: /health
    dockerCommand: sh -c "npx prisma migrate deploy && npx tsx packages/database/src/bootstrap.ts && node apps/api/dist/server.js"

  # ── Telegram Bot (webhook mode) ──────────────────────────────────────
  # WEBHOOK_URL ni deploy keyin o'z xizmat URL'ingizga o'rnating:
  #   WEBHOOK_URL=https://driverhub-bot.onrender.com
  # UptimeRobot: https://driverhub-bot.onrender.com/health
  - type: web
    name: driverhub-bot
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        value: "https://driverhub-bot.onrender.com"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: driverhub-db
          property: connectionString
    healthCheckPath: /health
    dockerCommand: node apps/bot/dist/bot.js

  # ── Worker (cron: notifications, score, reports) ─────────────────────
  # UptimeRobot: https://driverhub-worker.onrender.com/health
  - type: web
    name: driverhub-worker
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: driverhub-db
          property: connectionString
    healthCheckPath: /health
    dockerCommand: node apps/worker/dist/index.js

# ── PostgreSQL ───────────────────────────────────────────────────────
databases:
  - name: driverhub-db
    plan: free
    databaseName: driverhub
    ipAllowList: []
